name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m app.benchmark --write-report
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: web/data/benchmark-report.json
